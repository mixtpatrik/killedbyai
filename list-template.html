<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MC3PM7NKRX"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-MC3PM7NKRX');</script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{META_DESC}}">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <link rel="canonical" href="{{URL}}">
    <meta property="og:type" content="website"><meta property="og:url" content="{{URL}}"><meta property="og:title" content="{{TITLE}}"><meta property="og:description" content="{{META_DESC}}">
    <meta property="og:image" content="https://killedbyai.net/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:site_name" content="Killed by AI">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{META_DESC}}"><meta name="twitter:image" content="https://killedbyai.net/og-image.png">
    <link rel="alternate" type="application/rss+xml" title="Killed by AI RSS Feed" href="https://killedbyai.net/feed.xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#09090b">
    <style>
        /* Colors, type and the site menu come from the shared head block (SITE_HEAD in build.py). */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--wrap:1000px;--acc:{{ACC}};--acc-text:{{ACC_TEXT}}}
        html{-webkit-text-size-adjust:100%}
        body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;font-size:1rem}
        a{color:inherit}
        .wrap,.site-footer{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}
        .wrap{padding-top:1.25rem;padding-bottom:3rem}

        /* ---------- breadcrumb and header ---------- */
        .crumbs{font-size:.875rem;color:var(--text-dim)}
        .crumbs ol{list-style:none}
        .crumbs li{display:inline}
        /* the padding makes the tap target taller without moving the line; the separator never starts a line */
        .crumbs a{padding-block:.625rem;color:inherit;text-decoration:none}
        .crumbs a:hover{color:var(--acc-text);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px}
        .crumbs li:not(:last-child)::after{content:"\00A0\00A0\203A\0020";content:"\00A0\00A0\203A\0020" / "";margin-right:.25rem}
        .crumbs [aria-current]{color:var(--text-muted)}
        h1{font-family:var(--serif);font-size:clamp(2rem,5vw,3rem);font-weight:700;letter-spacing:-.015em;line-height:1.1;margin-top:1.25rem;overflow-wrap:break-word}
        .intro{max-width:44rem;margin-top:.75rem;color:var(--text-muted);font-size:1.0625rem;line-height:1.55}

        /* ---------- rows ---------- */
        .list{margin-top:1.75rem;border-top:1px solid var(--border)}
        .row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) 10rem;align-items:baseline;column-gap:1.5rem;min-height:44px;padding:.625rem 0;border-bottom:1px solid var(--border);text-decoration:none}
        /* every row shares the list's columns, so the last one is as wide as its longest value */
        @supports (grid-template-columns:subgrid){
            .list{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) auto;column-gap:1.5rem}
            .row{grid-column:1 / -1;grid-template-columns:subgrid}
        }
        .row>span:first-child{display:contents}
        .row b{font-size:.9375rem;font-weight:600}
        .row small{font-size:.8125rem;color:var(--text-dim)}
        .row .when{justify-self:end;text-align:right;font-size:.875rem;color:var(--text-muted);white-space:nowrap}
        .row .when b{color:var(--acc-text)}
        .row:hover>span:first-child b{color:var(--acc-text)}

        /* ---------- other roles ---------- */
        .siblings{margin-top:2.75rem}
        .siblings h2{font-family:var(--serif);font-size:1.375rem;font-weight:700;line-height:1.25;margin-bottom:.5rem}
        .siblings div{display:flex;flex-wrap:wrap;gap:0 1.5rem;font-size:.9375rem}
        .siblings a{display:inline-flex;align-items:baseline;gap:.375rem;padding-block:.375rem;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1px;text-underline-offset:3px}
        .siblings a:hover{color:var(--acc-text);text-decoration-color:var(--acc)}
        .siblings small{font-size:.8125rem;color:var(--text-dim)}

        /* ---------- footer ---------- */
        .site-footer{padding-bottom:3rem;font-size:.875rem;line-height:1.7;color:var(--text-dim)}
        .site-footer::before{content:"";display:block;margin-bottom:1.5rem;border-top:1px solid var(--border)}
        .site-footer a{color:var(--text-muted);text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1px;text-underline-offset:3px}
        .site-footer a:hover{color:var(--acc-text);text-decoration-color:var(--acc)}
        .site-footer p+p{margin-top:.5rem}

        @media(max-width:700px){
            /* name on the first line; the details and the date share the second */
            .row,.list{grid-template-columns:minmax(0,1fr) auto;column-gap:1rem}
            .row{row-gap:0}
            @supports (grid-template-columns:subgrid){.row{grid-template-columns:subgrid}}
            .row b{grid-column:1 / -1}
            .row .when b{grid-column:auto}
        }
        @media(max-width:600px){
            .wrap{padding-top:.75rem;padding-bottom:2.5rem}
            h1{margin-top:.75rem}
            .intro{font-size:1rem}
            .list{margin-top:1.25rem}
        }
        @media(pointer:coarse){.siblings a{min-height:44px;align-items:center}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    </style>
    <script type="application/ld+json">{{JSONLD}}</script>
    {{SITE_HEAD}}
</head>
<body>
    <nav class="site-nav" aria-label="Site">
        {{NAV}}
    </nav>
    <main class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="/">Killed by AI</a></li>{{CRUMB}}</ol></nav>
        <h1>{{H1}}</h1>
        <p class="intro">{{INTRO}}</p>
        <div class="list">{{ROWS}}</div>
        {{AFTER}}
    </main>
    <footer class="site-footer">
        {{FOOTER_LINKS}}
        <p class="footer-note">Data is <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a>: reuse it and link back.</p></footer>
</body>
</html>
